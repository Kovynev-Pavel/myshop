{% extends 'main/layout.html' %}
{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <title>{% block title %}Каталог{% endblock %}</title>
</head>
<body>
    {% block content %}
        <aside>
        {% for category in categories %} {# вывод всех категорий с помощью цикла #}
            <a href="{{ category.get_absolute_url }} {# функция, дающая индекс категориям #}">{{ category.name }}</a>{# название категории #}
        {% endfor %}
        </aside>
        <h1 class="katalog">Каталог товаров</h1>
    {% endblock %}
</body>
